name: Build and publish APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  release:
    types: [ "published" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK (debug firmada con el keystore fijo)
        run: gradle assembleDebug

      - name: Preparar APK para publicación
        run: cp app/build/outputs/apk/debug/app-debug.apk "conSaldo-${GITHUB_REF_NAME}.apk"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: conSaldo-${{ github.ref_name }}
          path: conSaldo-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Crear GitHub Release y adjuntar APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "conSaldo ${{ github.ref_name }}"
          generate_release_notes: true
          files: conSaldo-${{ github.ref_name }}.apk
